<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Event Browser</title>
  <link rel="stylesheet" href="styles.css">

  <!-- Google Identity Services -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>

  <!-- Supabase-->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body>

  <!-- Header / Navigation -->
  <header>
    <h1>Browse Events</h1>
    <nav>
      <ul>
        <li><a href="/index.html">Home</a></li>
        <li><a href="/calendar.html">Calendar</a></li>
      </ul>
    </nav>
  </header>

  <!-- Search & Filter Section -->
  <section>
    <h2>Search & Filters</h2>
    <input type="text" placeholder="Search events by title or description...">
    <select>
      <option value="">Filter by category</option>
      <option value="Academic">Academic</option>
      <option value="Social">Social</option>
      <option value="Sports">Sports</option>
    </select>
  </section>

  <!-- Events loaded from Supabase -->
  <div id="events">
    <p>Loading events...</p>
  </div>

  <footer>
    <p>&copy; 2025 CampusConnect. All rights reserved.</p>
  </footer>

  <script>
    const SUPABASE_URL = "https://mtjgmoctyzgfubkpsydg.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im10amdtb2N0eXpnZnVia3BzeWRnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTk2Mjc5MTksImV4cCI6MjA3NTIwMzkxOX0.9Ku1_VjUhsBUtHwPSiBCYAez8sWyhK0x6Hc2SVxpqnk";
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    async function loadEvents() {
      const { data, error } = await supabaseClient
        .from('events')
        .select('*');

      console.log('Events fetched:', data);

      const container = document.getElementById('events');
      container.innerHTML = '';

      if (error) {
        container.innerHTML = `<p>Error loading events: ${error.message}</p>`;
        return;
      }

      if (!data || data.length === 0) {
        container.innerHTML = '<p>No events found.</p>';
        return;
      }

      data.forEach(event => {
        const eventDiv = document.createElement('div');
        eventDiv.className = 'event';
        eventDiv.innerHTML = `
          <strong>${event.title}</strong><br>
          ${event.description || ''}<br>
          ${new Date(event.start_time).toLocaleString()} 
          ${event.end_time ? '- ' + new Date(event.end_time).toLocaleString() : ''}
          <br>
          <button onclick="deleteEvent(${event.id})">🗑️ Delete</button>
        `;
        container.appendChild(eventDiv);
      });
    }

    // Function to Delete Events
    async function deleteEvent(id){
      if(!confirm('Are you sure you want to delete this event?'))
        return;
      
      console.log('Deleting event with ID:', id);
      const { error } = await supabaseClient
        .from('events')
        .delete()
        .eq('id', id);

      if(error){
        alert('Error deleting the event: ' + error.message);
      }
      else{
        alert('Event has been deleted');
        loadEvents(); 
      }
    }

    loadEvents();
  </script>
</body>
</html>
